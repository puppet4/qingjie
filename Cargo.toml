[package]
name = "qingjie"
version = "0.1.0"
edition = "2021"
description = "轻截 — 低占用 Windows 本地截图工具"

[dependencies]
crc32fast = "1.5"
fdeflate = "0.3.7"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi"] }

[dev-dependencies]
png = "0.17"

[build-dependencies]
png = "0.17"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
